<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exact-KB Image Resizer</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 480px;
        }

        /* Logo container styling for perfect centering and spacing */
        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            width: 100%;
        }

        /* Mobile-responsive logo styling */
        .logo-img {
            max-width: 80%;
            height: auto;
            max-height: 80px; /* Prevents oversized logos from breaking layout */
            object-fit: contain;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 0.9rem;
        }

        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            background: #f1f5f9;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus {
            border-color: var(--primary-color);
        }

        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .status-panel {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #f1f5f9;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .download-link {
            display: inline-block;
            margin-top: 10px;
            color: var(--primary-color);
            font-weight: 600;
            text-decoration: none;
        }

        .download-link:hover {
            text-decoration: underline;
        }

        .preview-box {
            margin-top: 15px;
            text-align: center;
        }

        .preview-box img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo section replacing the old h1 heading -->
        <div class="logo-container">
            <img src="Untitled" alt="Logo" class="logo-img">
        </div>

        <!-- UI Elements (Always visible) -->
        <div class="form-group">
            <label for="imageInput">Select Photo</label>
            <input type="file" id="imageInput" accept="image/jpeg, image/png, image/webp">
        </div>

        <div class="form-group">
            <label for="targetSize">Max KB Target</label>
            <input type="number" id="targetSize" value="50" min="1" placeholder="e.g., 50">
        </div>

        <button id="compressBtn">Compress Image</button>

        <!-- Dynamic Output Panel -->
        <div class="status-panel" id="statusPanel">
            <div id="statusText">Ready. Choose an image and target size to begin.</div>
            <div class="preview-box" id="previewBox" style="display: none;">
                <img id="previewImg" src="" alt="Compressed preview">
                <br>
                <a id="downloadLink" class="download-link" href="#" download="compressed-image.jpg">Download Compressed Image</a>
            </div>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const targetSizeInput = document.getElementById('targetSize');
        const compressBtn = document.getElementById('compressBtn');
        const statusText = document.getElementById('statusText');
        const previewBox = document.getElementById('previewBox');
        const previewImg = document.getElementById('previewImg');
        const downloadLink = document.getElementById('downloadLink');

        compressBtn.addEventListener('click', () => {
            const file = imageInput.files[0];
            const targetKB = parseFloat(targetSizeInput.value);

            if (!file) {
                statusText.innerHTML = "<span style='color: #ef4444;'>Please select an image file first.</span>";
                return;
            }

            if (!targetKB || targetKB <= 0) {
                statusText.innerHTML = "<span style='color: #ef4444;'>Please enter a valid Max KB target.</span>";
                return;
            }

            statusText.innerText = "Processing image...";
            previewBox.style.display = "none";

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function (event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function () {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);

                    let quality = 0.90;
                    let low = 0.01;
                    let high = 1.0;
                    let resultBlob = null;
                    
                    function iterativeCompress() {
                        canvas.toBlob((blob) => {
                            const currentKB = blob.size / 1024;
                            
                            if ((high - low) < 0.02 || currentKB <= targetKB) {
                                resultBlob = blob;
                                if (currentKB > targetKB && quality > 0.1) {
                                    quality -= 0.05;
                                    iterativeCompress();
                                    return;
                                }
                                finalizeImage(blob, currentKB);
                            } else {
                                if (currentKB > targetKB) {
                                    high = quality;
                                } else {
                                    low = quality;
                                    resultBlob = blob;
                                }
                                quality = (low + high) / 2;
                                iterativeCompress();
                            }
                        }, 'image/jpeg', quality);
                    }

                    iterativeCompress();
                };
            };
        });

        function finalizeImage(blob, sizeKB) {
            const url = URL.createObjectURL(blob);
            previewImg.src = url;
            downloadLink.href = url;
            
            const originalName = imageInput.files[0].name.split('.').slice(0, -1).join('.');
            downloadLink.download = `${originalName}_compressed_${Math.round(sizeKB)}kb.jpg`;

            statusText.innerHTML = `<strong>Success!</strong><br>Original Size: ${Math.round(imageInput.files[0].size / 1024)} KB<br>New Size: ${sizeKB.toFixed(2)} KB`;
            previewBox.style.display = "block";
        }
    </script>
</body>
</html>
